name: Check no secrets are committed

# A second line of defence behind .gitignore and the pre-commit hook. It can't stop a
# push, but it fails loudly (GitHub emails you) if a secret file or your database
# was committed, so you can remove it and change the secret straight away.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail if a secret file, database or backup is tracked
        run: |
          offenders="$(git ls-files | grep -E '(^|/)\.env($|\.)|\.db($|-wal$|-shm$|\.bak$)|(^|/)\.radar-state$|\.bak[0-9]*$' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Secret or private files are committed:"
            printf '%s\n' "$offenders"
            echo "Remove them (git rm --cached <file>), commit, and treat any password or key in them as leaked: change it."
            exit 1
          fi
          echo "No secret files tracked."
